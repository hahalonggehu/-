name: Build switch NRO

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NRO
        working-directory: engine
        run: |
          export PATH="$PATH:/opt/devkitpro/tools/bin"
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jysdl-nro
          path: engine/jysdl.nro

      - name: Commit NRO back to repo
        run: |
          export PATH="$PATH:/opt/devkitpro/tools/bin"
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
          cp engine/jysdl.nro jysdl.nro
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add jysdl.nro
          git diff --cached --quiet && echo "no change, skip push" || git commit -m "build: add jysdl.nro"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}