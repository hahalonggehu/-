name: Build switch NRO

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install switch portlibs
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-sdl2 switch-sdl2_ttf switch-sdl2_mixer switch-sdl2_image \
            switch-zlib switch-libpng switch-libjpeg-turbo switch-freetype switch-bzip2 \
            switch-mesa switch-libdrm_nouveau \
            switch-opusfile switch-libopus switch-libwebp switch-mpg123 \
            switch-libvorbisidec switch-libogg switch-libmodplug switch-flac

      - name: Build NRO
        working-directory: engine
        run: |
          mkdir -p build/src build/minizip_config build/vendor/minizip build/vendor/minizip/compat build/vendor/lua/src
          export PATH="$PATH:/opt/devkitpro/tools/bin"
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jysdl-nro
          path: engine/jysdl.nro
          retention-days: 90