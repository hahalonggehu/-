name: Build switch NRO

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect portlibs
        run: |
          echo "===== base_rules ====="
          sed -n '1,40p' /opt/devkitpro/devkitA64/base_rules
          echo "===== header exists? ====="
          ls -la /opt/devkitpro/portlibs/switch/include/SDL2/SDL_ttf.h
          echo "===== probe compile ====="
          printf '#include <SDL_ttf.h>\nint main(void){return 0;}\n' > /tmp/t.cpp
          /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ -I/opt/devkitpro/portlibs/switch/include -I/opt/devkitpro/portlibs/switch/include/SDL2 -c /tmp/t.cpp -o /tmp/t.o && echo PROBE_OK || echo PROBE_FAIL

      - name: Install switch portlibs
        run: |
          dkp-pacman -S --noconfirm --needed \
            switch-sdl2 switch-sdl2_ttf switch-sdl2_mixer switch-sdl2_image \
            switch-zlib switch-libpng switch-libjpeg-turbo switch-freetype switch-bzip2

      - name: Build NRO
        working-directory: engine
        run: |
          E="$(pwd)"
          P=/opt/devkitpro/portlibs/switch/include
          printf '#!/bin/sh\nexec /opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc -I"%s/src" -I"%s/minizip_config" -I"%s/vendor/minizip" -I"%s/vendor/minizip/compat" -I"%s/vendor/lua/src" -I"%s/include" -I"%s/include/SDL2" "$@"\n' "$E" "$E" "$E" "$E" "$E" "$P" "$P" > /tmp/ccwrap
          printf '#!/bin/sh\nexec /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ -I"%s/src" -I"%s/minizip_config" -I"%s/vendor/minizip" -I"%s/vendor/minizip/compat" -I"%s/vendor/lua/src" -I"%s/include" -I"%s/include/SDL2" "$@"\n' "$E" "$E" "$E" "$E" "$E" "$P" "$P" > /tmp/cxxwrap
          chmod +x /tmp/ccwrap /tmp/cxxwrap
          export PATH="$PATH:/opt/devkitpro/tools/bin"
          echo "== CXX=$CXX =="
          echo "== CC=$CC =="
          echo "== base_rules lines 10-25 =="
          sed -n '10,25p' /opt/devkitpro/devkitA64/base_rules
          echo "== make trace =="
          make --trace 2>&1 | head -40

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jysdl-nro
          path: engine/jysdl.nro

      - name: Commit NRO back to repo
        run: |
          export PATH="$PATH:/opt/devkitpro/tools/bin"
          apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
          cp engine/jysdl.nro jysdl.nro
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add jysdl.nro
          git diff --cached --quiet && echo "no change, skip push" || git commit -m "build: add jysdl.nro"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}